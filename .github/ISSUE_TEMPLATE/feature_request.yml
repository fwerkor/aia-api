name: AIA API 功能建议
description: 为本仓库提出明确的功能需求
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [AIA API 文档](https://github.com/fwerkor/aia-api/blob/main/docs/README.md)，说明新功能与论坛登录、贡献密钥池、平台额度等现有工作流的关系。
  - type: textarea
    id: goal
    attributes:
      label: 需要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与兼容性影响
    validations:
      required: true
