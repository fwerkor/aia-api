name: AIA API Feature Request
description: Propose a feature for this fork
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Read [AIA API documentation](https://github.com/fwerkor/aia-api/blob/main/docs/README.md). Explain how the proposal fits Forum OIDC sign-in, the contributed-key pool or the platform's credit system.
  - type: textarea
    id: goal
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and compatibility impact
    validations:
      required: true
