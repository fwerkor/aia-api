name: AIA API Bug Report
description: Report a bug in this fork without sharing secrets
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Read the [AIA API docs](https://github.com/fwerkor/aia-api/blob/main/docs/README.md) first.
        Never paste API tokens, contributed upstream keys, redemption codes, cookies or personal data. Report vulnerabilities in a private security advisory.
  - type: input
    id: version
    attributes:
      label: Release or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [AIA Forum OIDC sign-in, Model API relay, Contributed-key pool, Model/provider administration, Credits/redemption, Docker deployment, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and actual result
      description: For relay issues, compare redacted direct-provider and AIA API responses.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
