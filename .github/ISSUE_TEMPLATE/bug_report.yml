name: AIA API 问题反馈
description: 反馈当前仓库的缺陷（请勿提交密钥）
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先参阅 [AIA API 文档](https://github.com/fwerkor/aia-api/blob/main/docs/README.md)。
        **禁止粘贴 API Token、贡献的密钥、兑换码、Cookie 或用户隐私。** 安全漏洞应使用私密 Security Advisory。
  - type: input
    id: version
    attributes:
      label: 版本或 Commit
      placeholder: vX.Y.Z / commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题模块
      options: [AIA Forum OIDC 登录, 模型 API 转发, 共享密钥池, 模型与上游管理, 额度与兑换码, Docker 部署, 其他]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤和实际结果
      description: 转发问题请附脱敏后的直连上游与经过 AIA API 的对比结果。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
